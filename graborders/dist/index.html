<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <!-- Device redirect: runs BEFORE the app bundle so big screens go to the PC site.
       Only active on the production domain (local dev is untouched). -->
  <script>
    (function () {
      try {
        var host = location.hostname;
        var onMobileDomain = host === 'indiaallvorafx.cc' || host === 'www.indiaallvorafx.cc';
        if (!onMobileDomain) return;

        var ua = navigator.userAgent || '';
        var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
        // Use the largest of the available width signals (physical screen + window)
        // so a desktop is reliably detected regardless of window size or timing.
        var w = Math.max(
          window.innerWidth || 0,
          (window.screen && window.screen.width) || 0,
          document.documentElement.clientWidth || 0
        );

        // Large device + not a phone/tablet → send to the PC site
        if (!isMobileUA && w >= 1024) {
          location.replace('https://pc.indiaallvorafx.cc' + location.pathname + location.search + location.hash);
        }
      } catch (e) {}
    })();
  </script>
