server {
    listen 80;
    server_name pc.indiaironfx.online www.pc.indiaironfx.online;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # ==========================
    # APK File Configuration
    # ==========================
    location ~* \.apk$ {
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=pc.alvorafx.apk";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD";
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # ==========================
    # Vite Hashed Assets (MUST be ^~ so it beats regex blocks)
    # ==========================
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ==========================
    # TradingView Static Files  — MUST come before generic static regex
    # ==========================
    location ^~ /tv-static/ {
        proxy_pass https://s3.tradingview.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host s3.tradingview.com;

        # Allow TV scripts to be used by your page
        add_header Access-Control-Allow-Origin "*";
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
    }

    # ==========================
    # TradingView Screener API
    # ==========================
    location ^~ /api/tv/ {
        proxy_pass https://screener-facade.tradingview.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host screener-facade.tradingview.com;
        proxy_set_header Origin "https://www.tradingview.com";
        proxy_set_header Referer "https://www.tradingview.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "application/json, text/plain, */*";
    }

    # ==========================
    # TradingView Scanner REST (live quotes fallback)  <-- NEW
    # Reliable POST /global/scan endpoint used by the futures page so the
    # live price always loads even when the realtime WebSocket relay is down.
    # Must be its own ^~ block so it beats the generic /api/ backend proxy.
    # ==========================
    location ^~ /api/tvscan/ {
        proxy_pass https://scanner.tradingview.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host scanner.tradingview.com;
        proxy_set_header Origin "https://www.tradingview.com";
        proxy_set_header Referer "https://www.tradingview.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "application/json, text/plain, */*";
        proxy_set_header Content-Type "application/json";
    }

    # ==========================
    # TradingView WebSocket
    # ==========================
    location ^~ /ws/ {
        proxy_pass https://widgetdata.tradingview.com/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host widgetdata.tradingview.com;
        proxy_set_header Origin "https://www.tradingview.com";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_ssl_server_name on;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 86400;
    }

    # ==========================
    # Socket.IO WebSocket
    # ==========================
    location ^~ /socket.io/ {
        proxy_pass http://200.234.47.155:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 86400;
    }

    # ==========================
    # Backend API
    # ==========================
    location ^~ /api/ {
        proxy_pass http://200.234.47.155:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================
    # Other Static Files (fonts, images, etc.)
    # Only hits disk — never intercepts proxied paths above
    # ==========================
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|json|txt|xml|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ==========================
    # React / Vite SPA catch-all
    # ==========================
    location / {
        try_files $uri /index.html;
    }
}